<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BREAK IN: THORNTON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1 class="title">BREAK IN</h1>
        <p style="color:white; letter-spacing: 5px; margin: 0;">THORNTON: 104TH AVE</p>
        <p style="color: #ffaa00; font-size: 12px; font-style: italic; margin-bottom: 20px;">Inspired by the legendary Cracky4</p>
        
        <div class="setup-box">
            <button class="btn" onclick="hostGame()">HOST HOUSE</button>
            <div style="margin: 15px 0;">
                <input type="text" id="joinID" placeholder="Enter Friend's ID">
                <button class="btn" onclick="joinGame()">JOIN</button>
            </div>
        </div>
        <p id="my-id-display" style="color: yellow; font-size: 14px; font-weight: bold;"></p>
        <div class="discord-tag"><a href="https://discord.gg/mYdWExTQE" target="_blank">Join Discord</a></div>
    </div>

    <div id="ui" style="display: none;">
        <div class="top-hud">
            <div class="stat-bar"><div id="hp-fill"></div><span>HP</span></div>
            <div class="stat-bar energy"><div id="en-fill"></div><span>ENERGY</span></div>
            <div class="timer-box">TIME: <span id="timer">60s</span></div>
        </div>

        <div id="interact-label">Press [E] to Interact</div>

        <div id="mobile-controls">
            <div class="d-pad">
                <button ontouchstart="move.f=true" ontouchend="move.f=false">▲</button>
                <div class="mid-row">
                    <button ontouchstart="move.l=true" ontouchend="move.l=false">◀</button>
                    <button ontouchstart="move.r=true" ontouchend="move.r=false">▶</button>
                </div>
                <button ontouchstart="move.b=true" ontouchend="move.b=false">▼</button>
            </div>
            <div class="action-btns">
                <button class="sprint-btn" ontouchstart="isSprinting=true" ontouchend="isSprinting=false">RUN</button>
                <button class="interact-btn" onclick="triggerMobileInteract()">E</button>
            </div>
        </div>

        <div id="comms-panel">
            <div id="chat-log"></div>
            <input type="text" id="chat-msg" placeholder="Press Enter to Chat...">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
