<div id="comms-panel">
    <div class="vc-controls">
        <button id="mic-btn" onclick="toggleMic()" class="btn-small">🎤 Mic: OFF</button>
        <span id="vc-status" style="font-size: 10px; color: #aaa;"></span>
    </div>

    <div id="chat-container">
        <div id="chat-log"></div>
        <input type="text" id="chat-msg" placeholder="Enter to chat...">
    </div>

    <div id="quick-chat">
        <button onclick="sendQuickChat('HELP!')">🆘 HELP</button>
        <button onclick="sendQuickChat('Hide!')">🏚️ HIDE</button>
        <button onclick="sendQuickChat('I need food!')">🍕 FOOD</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
