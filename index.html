<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BREAK IN: THORNTON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu">
        <h1 class="title">BREAK IN</h1>
        <p style="color:white">THORNTON: 104TH AVE</p>
        <div class="setup-box">
            <button class="btn" onclick="hostGame()">HOST HOUSE</button>
            <input type="text" id="joinID" placeholder="Friend's ID">
            <button class="btn" onclick="joinGame()">JOIN</button>
        </div>
        <p id="my-id-display" style="color: yellow; font-size: 11px;"></p>
    </div>

    <div id="ui" style="display: none;">
        <div class="top-hud">
            <div class="stat-bar"><div id="hp-fill"></div><span>HP</span></div>
            <div class="stat-bar energy"><div id="en-fill"></div><span>ENERGY</span></div>
            <div class="timer-box">TIME: <span id="timer">60s</span></div>
        </div>

        <div id="interact-label">Press [E] to Interact</div>

        <div id="comms-panel">
            <div id="chat-log"></div>
            <input type="text" id="chat-msg" placeholder="Press Enter to Chat...">
            <div id="quick-chat">
                <button onclick="sendQuickChat('I\'m Hungry!')">🍕 FOOD</button>
                <button onclick="sendQuickChat('Board this!')">🔨 BOARD</button>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
